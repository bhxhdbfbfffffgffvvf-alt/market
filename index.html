<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой Маркет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #fff);
    color: var(--tg-theme-text-color, #000);
    padding: 16px;
    padding-bottom: 100px;
  }
  h1 { font-size: 22px; margin: 0 0 4px 0; }
  .subtitle { font-size: 14px; color: #888; margin: 0 0 16px 0; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
  }
  .card {
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 12px;
    padding: 10px;
    background: var(--tg-theme-secondary-bg-color, #f7f7f7);
  }
  .card img {
    width: 100%; height: 110px; object-fit: cover;
    border-radius: 8px; margin-bottom: 8px;
  }
  .card h3 { font-size: 15px; margin: 0 0 4px 0; }
  .card .desc { font-size: 12px; color: #888; margin: 0 0 6px 0; }
  .card .price { font-size: 15px; font-weight: 600; margin: 0 0 8px 0; }
  .card button {
    width: 100%; padding: 8px 12px; border-radius: 8px; border: none;
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #fff);
    font-size: 14px; cursor: pointer;
  }
  .floating {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    padding: 12px 24px; border-radius: 30px; border: none;
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #fff);
    font-size: 15px; font-weight: 600;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    cursor: pointer; z-index: 50;
  }
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: none; align-items: flex-end; z-index: 100;
  }
  .overlay.open { display: flex; }
  .cart {
    width: 100%; max-height: 85vh; overflow-y: auto;
    background: var(--tg-theme-bg-color, #fff);
    border-top-left-radius: 20px; border-top-right-radius: 20px;
    padding: 20px;
  }
  .cart h2 { margin: 0 0 12px 0; font-size: 20px; }
  .cart .empty { color: #888; text-align: center; padding: 20px 0; }
  .item {
    display: flex; align-items: center; gap: 8px;
    padding: 10px; border-radius: 10px;
    background: var(--tg-theme-secondary-bg-color, #f7f7f7);
    margin-bottom: 8px;
  }
  .item .info { flex: 1; }
  .item .name { font-size: 14px; font-weight: 600; }
  .item .sub { font-size: 12px; color: #888; }
  .qty { display: flex; align-items: center; gap: 6px; }
  .qty button {
    width: 28px; height: 28px; border-radius: 6px; border: none;
    background: #e5e5e5; font-size: 16px; cursor: pointer;
  }
  .qty .val { min-width: 20px; text-align: center; font-size: 14px; }
  .remove {
    width: 28px; height: 28px; border-radius: 6px; border: none;
    background: #ffdddd; color: #c00; cursor: pointer;
  }
  .total {
    display: flex; justify-content: space-between; margin-top: 16px;
    padding-top: 12px; border-top: 1px solid #eee; font-size: 16px;
  }
  .order {
    width: 100%; margin-top: 12px; padding: 14px 0;
    border-radius: 12px; border: none;
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #fff);
    font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .close {
    width: 100%; margin-top: 8px; padding: 10px 0;
    border-radius: 12px; border: none; background: transparent;
    color: #888; font-size: 14px; cursor: pointer;
  }
</style>
</head>
<body>

<h1 id="greeting">Привет 👋</h1>
<p class="subtitle">Выбирай товары и добавляй в корзину</p>

<div class="grid" id="grid"></div>

<button class="floating" onclick="openCart()">
  🛒 Корзина <span id="cartCount"></span>
</button>

<div class="overlay" id="overlay" onclick="closeCart(event)">
  <div class="cart" onclick="event.stopPropagation()">
    <h2>Корзина</h2>
    <div id="cartContent"></div>
  </div>
</div>

<script>
  const products = [
    { id: 1, name: "Футболка", price: 1500, description: "Хлопок, S–XL", image: "https://picsum.photos/seed/tshirt/400/300" },
    { id: 2, name: "Кружка", price: 800, description: "Керамика, 350 мл", image: "https://picsum.photos/seed/mug/400/300" },
    { id: 3, name: "Стикерпак", price: 300, description: "10 наклеек", image: "https://picsum.photos/seed/stickers/400/300" },
    { id: 4, name: "Худи", price: 3200, description: "Тёплое, с капюшоном", image: "https://picsum.photos/seed/hoodie/400/300" }
  ];

  let cart = [];
  const tg = window.Telegram?.WebApp;

  if (tg) {
    tg.ready();
    tg.expand();
    const user = tg.initDataUnsafe?.user;
    if (user) {
      document.getElementById("greeting").textContent =
        "Привет, " + (user.first_name || user.username || "друг") + " 👋";
    }
  }

  function renderGrid() {
    const grid = document.getElementById("grid");
    grid.innerHTML = products.map(p => `
      <div class="card">
        <img src="${p.image}" alt="${p.name}">
        <h3>${p.name}</h3>
        <p class="desc">${p.description}</p>
        <p class="price">${p.price} ₽</p>
        <button onclick="addToCart(${p.id})">В корзину</button>
      </div>
    `).join("");
  }

  function addToCart(id) {
    const product = products.find(p => p.id === id);
    const existing = cart.find(i => i.product.id === id);
    if (existing) {
      existing.qty += 1;
    } else {
      cart.push({ product, qty: 1 });
    }
    renderCart();
  }

  function decreaseQty(id) {
    const item = cart.find(i => i.product.id === id);
    if (!item) return;
    item.qty -= 1;
    if (item.qty <= 0) cart = cart.filter(i => i.product.id !== id);
    renderCart();
  }

  function removeFromCart(id) {
    cart = cart.filter(i => i.product.id !== id);
    renderCart();
  }

  function totalSum() {
    return cart.reduce((sum, i) => sum + i.product.price * i.qty, 0);
  }

  function totalCount() {
    return cart.reduce((sum, i) => sum + i.qty, 0);
  }

  function renderCart() {
    document.getElementById("cartCount").textContent =
      totalCount() > 0 ? "(" + totalCount() + ")" : "";

    const container = document.getElementById("cartContent");

    if (cart.length === 0) {
      container.innerHTML = '<p class="empty">Пока пусто</p><button class="close" onclick="closeCart()">Закрыть</button>';
      return;
    }

    container.innerHTML = cart.map(i => `
      <div class="item">
        <div class="info">
          <div class="name">${i.product.name}</div>
          <div class="sub">${i.product.price} ₽ × ${i.qty} = ${i.product.price * i.qty} ₽</div>
        </div>
        <div class="qty">
          <button onclick="decreaseQty(${i.product.id})">−</button>
          <span class="val">${i.qty}</span>
          <button onclick="addToCart(${i.product.id})">+</button>
          <button class="remove" onclick="removeFromCart(${i.product.id})">✕</button>
        </div>
      </div>
    `).join("") + `
      <div class="total">
        <span>Итого:</span>
        <strong>${totalSum()} ₽</strong>
      </div>
      <button class="order" onclick="sendOrder()">Оформить заказ</button>
      <button class="close" onclick="closeCart()">Закрыть</button>
    `;
  }

  function openCart() {
    renderCart();
    document.getElementById("overlay").classList.add("open");
  }

  function closeCart(event) {
    if (event && event.target.id !== "overlay" && event.target.className !== "close") return;
    document.getElementById("overlay").classList.remove("open");
  }

  function sendOrder() {
    if (!tg) {
      alert("Открой через Telegram-бота");
      return;
    }
    if (cart.length === 0) {
      tg.showAlert("Корзина пуста");
      return;
    }

    const order = {
      type: "order",
      items: cart.map(i => ({
        id: i.product.id,
        name: i.product.name,
        price: i.product.price,
        qty: i.qty
      })),
      total: totalSum(),
      createdAt: new Date().toISOString()
    };

    tg.sendData(JSON.stringify(order));
    cart = [];
    renderCart();
    closeCart();
  }

  renderGrid();
  renderCart();
</script>

</body>
</html>
